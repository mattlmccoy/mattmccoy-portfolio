<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFAM Process Workflow</title>
<meta name="description" content="Interactive isometric figure of the RFAM workflow: binder jet printing of graphite-doped PA12, then RF heating at 13.56 MHz between copper plates.">
</head>
<body>

<style>
/* layout: one framed isometric figure, centered, page ground follows the viewer theme */
:root { --page:#f2f2ef; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page:#0b0b0b; color-scheme: dark; } }
:root[data-theme="dark"] { --page:#0b0b0b; color-scheme: dark; }
body { background: var(--page); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }

.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1040px,100% - 32px);margin:64px auto 96px}

#rfam { background: transparent; }
</style>
<div class="iso" id="rfam" data-theme="light"><main class="iso-page">
<style>
.rf-led{fill:var(--anatomy-faint);stroke:none;transition:fill .3s}
.rf-led.on{fill:var(--anatomy-red)}
.rf-screen,.rf-hole{fill:var(--anatomy-shade-0);stroke:none}
.rf-window{fill:color-mix(in srgb,var(--anatomy-blue) 10%,var(--anatomy-shade-1));stroke:none}
.iso-solid{--tint:none}
.rf-copper .iso-solid>.iso-top,.rf-copper .iso-solid>.iso-shade,.rf-copper .iso-solid>.iso-fill{fill:color-mix(in srgb,#c47a4a 40%,var(--anatomy-shade-2))}
.rf-copper .iso-solid>.iso-shade[data-shade="0"]{fill:color-mix(in srgb,#c47a4a 30%,var(--anatomy-shade-0))}
.rf-fr4 .iso-solid>.iso-top,.rf-fr4 .iso-solid>.iso-shade{fill:color-mix(in srgb,#3f9a7a 30%,var(--anatomy-shade-2))}
.rf-ferrite .iso-solid>.iso-top,.rf-ferrite .iso-solid>.iso-shade,.rf-ferrite .iso-solid>.iso-fill{fill:color-mix(in srgb,#b0643a 34%,var(--anatomy-shade-1))}
.rf-wire .iso-line{stroke:color-mix(in srgb,#d0703a 75%,var(--anatomy-hi))}
.rf-tan .iso-solid>.iso-top,.rf-tan .iso-solid>.iso-shade{fill:color-mix(in srgb,#9a6a45 35%,var(--anatomy-shade-2))}
.rf-cap .iso-solid>.iso-top,.rf-cap .iso-solid>.iso-shade{fill:color-mix(in srgb,#c9b79a 30%,var(--anatomy-shade-3))}
.rf-black .iso-solid>.iso-top,.rf-black .iso-solid>.iso-shade,.rf-black .iso-solid>.iso-fill{fill:color-mix(in srgb,#000 55%,var(--anatomy-shade-0))}
.rf-clear .iso-solid>.iso-top,.rf-clear .iso-solid>.iso-shade{fill:color-mix(in srgb,var(--anatomy-blue) 6%,var(--anatomy-shade-3))}
.rf-band .tb-body,.rf-band .tb-shine,.rf-band .tb-shade{fill:color-mix(in srgb,#c0392b 80%,var(--anatomy-shade-2))}
.rf-braid .iso-line,.rf-braid-tube .tb-edge{stroke:#b06a3a}
.rf-braid .iso-line{stroke-width:2.2}
.rf-braid-tube .tb-body,.rf-braid-tube .tb-shine,.rf-braid-tube .tb-shade{fill:color-mix(in srgb,#b06a3a 70%,var(--anatomy-shade-2))}
.rf-tie .iso-line{stroke:#e2c52b;stroke-width:1.4}
.rf-ink .iso-solid>.iso-top{fill:color-mix(in srgb,#111 80%,transparent)}
.rf-doped{--heat:0}
.rf-doped .iso-solid>.iso-top,.rf-doped .iso-solid>.iso-shade,.rf-doped .iso-solid>.iso-fill{fill:color-mix(in srgb,#ff5a36 calc(var(--heat)*85%),#161616) !important}
.rf-doped .rf-doped-face{fill:color-mix(in srgb,#ff5a36 calc(var(--heat)*85%),#161616);stroke:var(--anatomy-hi);stroke-width:.6px}
.rf-crater{fill:var(--anatomy-shade-0)}
.rf-heater .iso-solid>.iso-top,.rf-heater .iso-solid>.iso-shade,.rf-heater .iso-solid>.iso-fill{fill:color-mix(in srgb,#ff6a2a calc(var(--glow,0)*90%),var(--anatomy-shade-1))}
.rf-alu .iso-solid>.iso-top{fill:color-mix(in srgb,var(--anatomy-blue) 4%,var(--anatomy-top))}
.rf-teal .iso-solid>.iso-top{fill:color-mix(in srgb,#1d4b57 64%,var(--anatomy-shade-2))}
.rf-teal .iso-solid>.iso-shade,.rf-teal .iso-solid>.iso-fill{fill:color-mix(in srgb,#1d4b57 74%,var(--anatomy-shade-1))}
.rf-teal .iso-solid>.iso-shade[data-shade="0"]{fill:color-mix(in srgb,#1d4b57 74%,var(--anatomy-shade-0))}
.rf-deck .iso-solid>.iso-top{fill:color-mix(in srgb,#8d979c 22%,var(--anatomy-shade-3))}
.rf-deck .iso-solid>.iso-shade,.rf-deck .iso-solid>.iso-fill{fill:color-mix(in srgb,#8d979c 22%,var(--anatomy-shade-2))}
.rf-yellow .iso-solid>.iso-top,.rf-yellow .iso-solid>.iso-shade,.rf-yellow .iso-solid>.iso-fill{fill:color-mix(in srgb,#f0c000 75%,var(--anatomy-shade-2))}
.rf-steel .iso-solid>.iso-top,.rf-steel .iso-solid>.iso-shade{fill:var(--anatomy-shade-3)}
.rf-steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.rf-steps button{font:inherit;font-size:12px;color:var(--anatomy-text);background:transparent;border:1px solid var(--anatomy-faint);border-radius:999px;padding:3px 10px;cursor:pointer}
.rf-steps button[data-on]{color:var(--anatomy-strong);border-color:var(--anatomy-mid)}
.rf-steps button:focus-visible,.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:4px}
</style><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 1</span><span class="iso-plate-corner" data-corner="title">RFAM: from printed layers to RF sintering</span><span class="iso-plate-corner" data-corner="hint">Hover to scrub the process · arrow keys step</span><span class="iso-plate-corner" data-corner="readout" data-readout>layer 1 of 6 · recoater rolls PA12 into the build cylinder</span></div><div class="iso-stage" tabindex="0" role="slider" aria-label="RFAM process: arrow keys step through printing, transfer, RF heating and cooling" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 980 520" role="img" aria-label="The RFAM process on one bench. On the left, the binder jet test bed: an aluminium extrusion table with a deck carrying, from left to right, the jetting gantry and the recoater at home, a round feed piston of PA12, the build cylinder screwed into a square substrate on the part piston, and an overflow slot; a metrology camera on a mast, a touchscreen and a controls box. Layer by layer the recoater roller carries PA12 from the feed into the build cylinder and the print head jets graphite ink into the part's footprint, so a doped green part grows inside loose powder; the front of the deck and the cylinder are cut away to show the layers in section. The cylinder is then unscrewed from the substrate, carried over to a hex-perforated Faraday cage, and set on a white pedestal between two copper-clad plates held by white clip posts and red bands. Beside it a black deflector and the O7 network: HT50 capacitors and two wound four-core transformer stacks on a green board, fed by a coax through a bonded entry on the back wall from a 13.56 MHz generator and tuner outside. With RF on, the graphite-doped region heats, the PA12 around it melts and the part sinks into a crater while the undoped powder stays loose."><path class="iso-halo" d="M25.4 319.8L25.4 318.5L26 317.3L112.1 184.7L113.1 183.6L114.6 182.5L116.4 181.7L118.5 181L120.9 180.5L123.4 180.3L125.9 180.3L128.4 180.6L945.7 313.4L948 313.9L950.1 314.6L951.9 315.5L953.2 316.6L954.2 317.8L954.6 319L954.6 332.4L954.6 333.7L954 334.9L867.9 467.5L866.9 468.6L865.4 469.7L863.6 470.5L861.5 471.2L859.1 471.7L856.6 471.9L854.1 471.9L851.6 471.6L34.3 338.8L32 338.3L29.9 337.6L28.1 336.7L26.8 335.6L25.8 334.4L25.4 333.2Z"/><g class="iso-solid"><path class="iso-fill" d="M127.4 210.7L127.8 209.6L128.8 208.5L130.2 207.6L132 206.8L134 206.3L136.3 206L138.6 206L140.8 206.2L142.9 206.7L144.8 207.4L146.3 208.3L147.3 209.3L147.9 210.5L147.9 211.6L147.9 213.6L147.5 214.8L146.5 215.8L145.1 216.7L143.3 217.5L141.3 218L139 218.3L136.7 218.3L134.5 218.1L132.4 217.6L130.5 216.9L129 216L128 215L127.4 213.9L127.4 212.7Z"/><path class="iso-shade" data-shade="0" d="M147.5 214.8L146.5 215.8L146.5 213.8L147.5 212.7ZM146.5 215.8L145.1 216.7L145.1 214.7L146.5 213.8ZM145.1 216.7L143.3 217.5L143.3 215.5L145.1 214.7ZM147.9 213.6L147.5 214.8L147.5 212.7L147.9 211.6Z"/><path class="iso-shade" data-shade="1" d="M143.3 217.5L141.3 218L141.3 216L143.3 215.5ZM141.3 218L139 218.3L139 216.3L141.3 216ZM139 218.3L136.7 218.3L136.7 216.3L139 216.3Z"/><path class="iso-shade" data-shade="2" d="M136.7 218.3L134.5 218.1L134.5 216.1L136.7 216.3ZM134.5 218.1L132.4 217.6L132.4 215.6L134.5 216.1Z"/><path class="iso-shade" data-shade="3" d="M132.4 217.6L130.5 216.9L130.5 214.9L132.4 215.6ZM130.5 216.9L129 216L129 214L130.5 214.9ZM129 216L128 215L128 213L129 214ZM128 215L127.4 213.9L127.4 211.8L128 213ZM127.4 213.9L127.4 212.7L127.4 210.7L127.4 211.8Z"/><path class="iso-top" d="M147.5 212.7L146.5 213.8L145.1 214.7L143.3 215.5L141.3 216L139 216.3L136.7 216.3L134.5 216.1L132.4 215.6L130.5 214.9L129 214L128 213L127.4 211.8L127.4 210.7L127.8 209.6L128.8 208.5L130.2 207.6L132 206.8L134 206.3L136.3 206L138.6 206L140.8 206.2L142.9 206.7L144.8 207.4L146.3 208.3 eed into the cylinder and the print head jets graphite ink only where the part should be. Six drawn layers stand in for the many in a real build, and the front of the deck and cylinder is cut away so the doped green part shows in section. Right: the cylinder is unscrewed from the substrate and set on the pedestal between the two copper-clad plates (white clip posts, red bands) in the hex-perforated Faraday cage, as in the 10-27 lab photos, beside the black deflector and the O7 network on its green board, fed by a coax through the bonded back-wall entry from the 13.56 MHz generator and tuner outside. At the standard 250 W the graphite-doped region couples to the field and heats while the undoped powder stays loose; the heating color is paced by the 10-27 disk rate (6.6 mK/s/W, past the 171 °C PA12 melt onset in about 90 s), and the slump into a crater is illustrative.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {

const SHOWN = MODEL.layer.count;
const T_LAYER = 2;

    s.depth = n + (u < 0.1 ? ease(u / 0.1) : 1);

    if (u < 0.1) s.sub = "part piston drops one layer inside the build cylinder";
    else if (u < 0.3) {
      s.rcX = lerp(C.RC_X[0], C.RC_X[1], ease((u - 0.1) / 0.2));
      if (s.rcX > C.BUILD_X) s.layers = n + 1;
      s.sub = "recoater rolls PA12 from the feed into the build cylinder, excess to the overflow";
    } else {
      s.layers = n + 1;
      s.inked = doped(s.layers) ? s.layers : n;
      if (u < 0.58) {
        s.rcX = C.RC_X[1];
        s.phX = lerp(C.PH_X[0], C.PH_X[1], ease((u - 0.3) / 0.28));
        if (doped(s.layers)) {
          const hx = s.phX + NOZZLE - C.BUILD_X;
          s.wet = clamp((hx + C.DOPED_R) / (2 * C.DOPED_R), 0, 1);
          s.drops = Math.abs(hx) < C.DOPED_R + 1 ? 1 : 0;
          if (s.wet < 1) s.inked = n;
          s.sub = "print head jets graphite ink into the part's footprint";
        } else s.sub = "undoped layer, no ink";
      } else if (u < 0.72) {
        s.rcX = C.RC_X[1];
        s.phX = lerp(C.PH_X[1], C.PH_X[0], ease((u - 0.58) / 0.14));

      } else if (u < 0.9) {

  } else if (drops.firstChild) drops.innerHTML = "";
  field.setAttribute("opacity", String(s.rf));
  const text = String(s.rf ? MODEL.rf.watts : 0).padStart(3, " ") + " W";
  if (genText && genText.textContent !== text) genText.textContent = text;
  genLed.classList.toggle("on", !!s.rf);
  if (printLed) printLed.classList.toggle("on", s.phase.startsWith("layer"));
  const r = readoutOf(s);
  if (readout.textContent !== r) readout.textContent = r;
  const idx = s.phase.startsWith("layer") ? 0 : s.phase === "RF on" ? 2 : s.phase === "RF off" ? 3 : 1;
  steps.forEach((el, i) => el.toggleAttribute("data-on", i === idx));
}

let clock = 0, target = 0, shown = 0, touring = !still.matches, frame = 0, last = 0, visible = false, idle = 0;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  if (touring) { clock = (clock + dt * (window.__driveSpeed || 1)) % TOTAL; target = clock; shown = clock; }
  else shown = still.matches ? target : shown + (target - shown) * (1 - Math.exp(-dt / 0.25));
  if (!touring && Math.abs(target - shown) < 0.002) shown = target;
  const s = stateAt(shown);
  draw(s);
  const settled = !touring && shown === target && !s.drops;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
const pause = (t) => {
  touring = false; target = clamp(t, 0, TOTAL - 0.001);
  clearTimeout(idle);
  idle = setTimeout(() => { if (!still.matches) { touring = true; clock = shown; run(); } }, 3600);
  run();
};
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("pointermove", (e) => { const b = svg.getBoundingClientRect(); pause(clamp((e.clientX - b.left) / b.width, 0, 1) * TOTAL); });
stage.addEventListener("keydown", (e) => {
  let i = PHASE_STARTS.findIndex((p, j) => shown >= p && (j === PHASE_STARTS.length - 1 || shown < PHASE_STARTS[j + 1]));
  if (e.key === "ArrowRight") i = Math.min(PHASE_STARTS.length - 1, i + 1);
  else if (e.key === "ArrowLeft") i = Math.max(0, i - 1);
  else if (e.key === "Home") i = 0;
  else if (e.key === "End") i = PHASE_STARTS.length - 1;
  else return;
  e.preventDefault();
  pause(PHASE_STARTS[i] + 0.01);
  stage.setAttribute("aria-valuenow", String(i));
  stage.setAttribute("aria-valuetext", ["printing", "last layer", "cylinder in the cage", "RF heating", "cooling"][i]);
});
steps.forEach((el, i) => el.addEventListener("click", () => pause(PHASE_STARTS[[0, 2, 3, 4][i]] + 0.01)));
if (still.matches) target = shown = PRINT + MOVE + RF * 0.62;
draw(stateAt(shown));
</script></div>
<script>
(() => {
  const el = document.getElementById("rfam");
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const apply = () => {
    const t = document.documentElement.getAttribute("data-theme");
    const dark = t ? t === "dark" : mq.matches;
    el.setAttribute("data-theme", dark ? "dark" : "light");
  };
  apply();
  mq.addEventListener("change", apply);
  new MutationObserver(apply).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
