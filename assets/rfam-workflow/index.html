<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFAM Process Workflow</title>
<meta name="description" content="Interactive isometric figure of the RFAM workflow: binder jet printing of graphite-doped PA12, then RF heating at 13.56 MHz between copper plates.">
</head>
<body>

<style>
/* layout: one framed isometric figure, centered, page ground follows the viewer theme */
:root { --page:#f2f2ef; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page:#0b0b0b; color-scheme: dark; } }
:root[data-theme="dark"] { --page:#0b0b0b; color-scheme: dark; }
body { background: var(--page); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }

.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1040px,100% - 32px);margin:64px auto 96px}

#rfam { background: transparent; }
</style>
<div class="iso" id="rfam" data-theme="light"><main class="iso-page">
<style>
.rf-led{fill:var(--anatomy-faint);stroke:none;transition:fill .3s}
.rf-led.on{fill:var(--anatomy-red)}
.rf-screen,.rf-hole{fill:var(--anatomy-shade-0);stroke:none}
.rf-window{fill:color-mix(in srgb,var(--anatomy-blue) 10%,var(--anatomy-shade-1));stroke:none}
.iso-solid{--tint:none}
.rf-copper .iso-solid>.iso-top,.rf-copper .iso-solid>.iso-shade,.rf-copper .iso-solid>.iso-fill{fill:color-mix(in srgb,#c47a4a 40%,var(--anatomy-shade-2))}
.rf-copper .iso-solid>.iso-shade[data-shade="0"]{fill:color-mix(in srgb,#c47a4a 30%,var(--anatomy-shade-0))}
.rf-fr4 .iso-solid>.iso-top,.rf-fr4 .iso-solid>.iso-shade{fill:color-mix(in srgb,#3f9a7a 30%,var(--anatomy-shade-2))}
.rf-ferrite .iso-solid>.iso-top,.rf-ferrite .iso-solid>.iso-shade,.rf-ferrite .iso-solid>.iso-fill{fill:color-mix(in srgb,#b0643a 34%,var(--anatomy-shade-1))}
.rf-wire .iso-line{stroke:color-mix(in srgb,#d0703a 75%,var(--anatomy-hi))}
.rf-tan .iso-solid>.iso-top,.rf-tan .iso-solid>.iso-shade{fill:color-mix(in srgb,#9a6a45 35%,var(--anatomy-shade-2))}
.rf-cap .iso-solid>.iso-top,.rf-cap .iso-solid>.iso-shade{fill:color-mix(in srgb,#c9b79a 30%,var(--anatomy-shade-3))}
.rf-black .iso-solid>.iso-top,.rf-black .iso-solid>.iso-shade,.rf-black .iso-solid>.iso-fill{fill:color-mix(in srgb,#000 55%,var(--anatomy-shade-0))}
.rf-clear .iso-solid>.iso-top,.rf-clear .iso-solid>.iso-shade{fill:color-mix(in srgb,var(--anatomy-blue) 6%,var(--anatomy-shade-3))}
.rf-band .tb-body,.rf-band .tb-shine,.rf-band .tb-shade{fill:color-mix(in srgb,#c0392b 80%,var(--anatomy-shade-2))}
.rf-braid .iso-line,.rf-braid-tube .tb-edge{stroke:#b06a3a}
.rf-braid .iso-line{stroke-width:2.2}
.rf-braid-tube .tb-body,.rf-braid-tube .tb-shine,.rf-braid-tube .tb-shade{fill:color-mix(in srgb,#b06a3a 70%,var(--anatomy-shade-2))}
.rf-tie .iso-line{stroke:#e2c52b;stroke-width:1.4}
.rf-ink .iso-solid>.iso-top{fill:color-mix(in srgb,#111 80%,transparent)}
.rf-doped{--heat:0}
.rf-doped .iso-solid>.iso-top,.rf-doped .iso-solid>.iso-shade,.rf-doped .iso-solid>.iso-fill{fill:color-mix(in srgb,#ff5a36 calc(var(--heat)*85%),#161616) !important}
.rf-doped .rf-doped-face{fill:color-mix(in srgb,#ff5a36 calc(var(--heat)*85%),#161616);stroke:var(--anatomy-hi);stroke-width:.6px}
.rf-crater{fill:var(--anatomy-shade-0)}
.rf-heater .iso-solid>.iso-top,.rf-heater .iso-solid>.iso-shade,.rf-heater .iso-solid>.iso-fill{fill:color-mix(in srgb,#ff6a2a calc(var(--glow,0)*90%),var(--anatomy-shade-1))}
.rf-alu .iso-solid>.iso-top{fill:color-mix(in srgb,var(--anatomy-blue) 4%,var(--anatomy-top))}
.rf-teal .iso-solid>.iso-top{fill:color-mix(in srgb,#1d4b57 64%,var(--anatomy-shade-2))}
.rf-teal .iso-solid>.iso-shade,.rf-teal .iso-solid>.iso-fill{fill:color-mix(in srgb,#1d4b57 74%,var(--anatomy-shade-1))}
.rf-teal .iso-solid>.iso-shade[data-shade="0"]{fill:color-mix(in srgb,#1d4b57 74%,var(--anatomy-shade-0))}
.rf-deck .iso-solid>.iso-top{fill:color-mix(in srgb,#8d979c 22%,var(--anatomy-shade-3))}
.rf-deck .iso-solid>.iso-shade,.rf-deck .iso-solid>.iso-fill{fill:color-mix(in srgb,#8d979c 22%,var(--anatomy-shade-2))}
.rf-yellow .iso-solid>.iso-top,.rf-yellow .iso-solid>.iso-shade,.rf-yellow .iso-solid>.iso-fill{fill:color-mix(in srgb,#f0c000 75%,var(--anatomy-shade-2))}
.rf-steel .iso-solid>.iso-top,.rf-steel .iso-solid>.iso-shade{fill:var(--anatomy-shade-3)}
.rf-steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.rf-steps button{font:inherit;font-size:12px;color:var(--anatomy-text);background:transparent;border:1px solid var(--anatomy-faint);border-radius:999px;padding:3px 10px;cursor:pointer}
.rf-steps button[data-on]{color:var(--anatomy-strong);border-color:var(--anatomy-mid)}
.rf-steps button:focus-visible,.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:4px}
</style><figure class="iso-figure"><div class="iso-plate"><div class="iso-plate-corners" aria-hidden="true"><span class="iso-plate-corner" data-corner="fig">Fig 1</span><span class="iso-plate-corner" data-corner="title">RFAM: from printed layers to RF sintering</span><span class="iso-plate-corner" data-corner="hint">Hover to scrub the process · arrow keys step</span><span class="iso-plate-corner" data-corner="readout" data-readout>layer 1 of 10 · recoater rolls PA12 into the build cylinder</span></div><div class="iso-stage" tabindex="0" role="slider" aria-label="RFAM process: arrow keys step through printing, transfer, RF heating and cooling" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="0 0 980 520" role="img" aria-label="The RFAM process on one bench. On the left, the binder jet test bed: an aluminium extrusion table with a deck carrying, from left to right, the jetting gantry and the recoater at home, a round feed piston of PA12, the build cylinder screwed into a square substrate on the part piston, and an overflow slot; a metrology camera on a mast, a touchscreen and a controls box. Layer by layer the recoater roller carries PA12 from the feed into the build cylinder and the print head jets graphite ink into the part's footprint, so a doped green part grows inside loose powder; the front of the deck and the cylinder are cut away to show the layers in section. The cylinder is then unscrewed from the substrate, carried over to a hex-perforated Faraday cage, and set on a white pedestal between two copper-clad plates held by white clip posts and red bands. Beside it a black deflector and the O7 network: HT50 capacitors and two wound four-core transformer stacks on a green board, fed by a coax through a bonded entry on the back wall from a 13.56 MHz generator and tuner outside. With RF on, the graphite-doped region heats, the PA12 around it melts and the part sinks into a crater while the undoped powder stays loose."><path class="iso-halo" d="M25 304L25 302.9L25.5 301.8L101.3 185.2L102.2 184.2L103.5 183.2L105.1 182.5L106.9 181.9L109 181.5L111.2 181.3L113.4 181.3L115.6 181.5L947.2 316.6L949.2 317.1L951.1 317.7L952.6 318.5L953.8 319.5L954.6 320.5L955 321.6L955 333.4L955 334.5L954.5 335.6L878.7 452.2L877.8 453.2L876.5 454.2L874.9 454.9L873.1 455.5L871 455.9L868.8 456.1L866.6 456.1L864.4 455.9L32.8 320.8L30.8 320.3L28.9 319.7L27.4 318.9L26.2 317.9L25.4 316.9L25 315.8Z"/><g class="iso-solid"><path class="iso-fill" d="M114.7 208L115.1 207L116 206.1L117.2 205.3L118.8 204.6L120.6 204.2L122.6 203.9L124.6 203.9L126.6 204.1L128.4 204.5L130 205.1L131.4 205.9L132.3 206.8L132.8 207.8L132.8 208.8L132.8 210.6L132.4 211.6L131.6 212.5L130.3 213.3L128.8 214L127 214.4L125 214.7L123 214.7L121 214.5L119.1 214.1L117.5 213.5L116.2 212.7L115.3 211.8L114.8 210.8L114.7 209.8Z"/><path class="iso-shade" data-shade="0" d="M132.4 211.6L131.6 212.5L131.6 210.7L132.4 209.8ZM131.6 212.5L130.3 213.3L130.3 211.6L131.6 210.7ZM130.3 213.3L128.8 214L128.8 212.2L130.3 211.6ZM132.8 210.6L132.4 211.6L132.4 209.8L132.8 208.8Z"/><path class="iso-shade" data-shade="1" d="M128.8 214L127 214.4L127 212.7L128.8 212.2ZM127 214.4L125 214.7L125 212.9L127 212.7ZM125 214.7L123 214.7L123 212.9L125 212.9Z"/><path class="iso-shade" data-shade="2" d="M123 214.7L121 214.5L121 212.7L123 212.9ZM121 214.5L119.1 214.1L119.1 212.3L121 212.7Z"/><path class="iso-shade" data-shade="3" d="M119.1 214.1L117.5 213.5L117.5 211.7L119.1 212.3ZM117.5 213.5L116.2 212.7L116.2 210.9L117.5 211.7ZM116.2 212.7L115.3 211.8L115.3 210L116.2 210.9ZM115.3 211.8L114.8 210.8L114.8 209L115.3 210ZM114.8 210.8L114.7 209.8L114.7 208L114.8 209Z"/><path class="iso-top" d="M132.4 209.8L131.6 210.7L130.3 211.6L128.8 212.2L127 212.7L125 212.9L123 212.9L121 212.7L119.1 212.3L117.5 211.7L116.2 210.9L115.3 210L114.8 209L114.7 208L115.1 207L116 206.1L117.2 205.3L118.8 204.6L120.6 204.2L122.6 203.9L124.6 203.9L126.6 204.1L128.4 204.5L130 205.1L131.4 205.9L end"><span class="iso-keys"><span class="iso-key"><svg class="iso-swatch" data-mark="lit" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Graphite-doped region: jetted ink, then the part RF heats</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>PA12 powder in the build cylinder, loose wherever no ink landed</span><span class="iso-key"><svg class="iso-swatch" data-mark="red" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>13.56 MHz field between the copper-clad plates</span></span><span class="iso-caption">The RFAM workflow on one bench. Left: the binder jet test bed, with the deck laid out as in the platform proposal sketch (jetting gantry and recoater at home on the left, then the feed piston, the part piston and the overflow) and the frame after the printer CAD render. The build cylinder is screwed into a square substrate on the part piston; each layer the recoater roller carries PA12 from the feed into the cylinder and the print head jets graphite ink only where the part should be. Ten drawn layers stand in for the many in a real build, and the front of the deck and cylinder is cut away so the doped green part shows in section. Right: the cylinder is unscrewed from the substrate and set on the pedestal between the two copper-clad plates (white clip posts, red bands) in the hex-perforated Faraday cage, as in the 10-27 lab photos, beside the black deflector and the O7 network on its green board, fed by a coax through the bonded back-wall entry from the 13.56 MHz generator and tuner outside. At the standard 250 W the graphite-doped region couples to the field and heats while the undoped powder stays loose; the heating color is paced by the 10-27 disk rate (6.6 mK/s/W, past the 171 °C PA12 melt onset in about 90 s), and the slump into a crater is illustrative.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;

// half discs (back half, y <= 0) for the cutaway, full discs once the cylinder is whole
function disc(r, full) {
  const pts = [];
  const n = 48, from = full ? 0 : Math.PI, span = full ? Math.PI * 2 : Math.PI;
  for (let i = 0; i <= n - (full ? 1 : 0); i++) { const a = from + (span * i) / n; pts.push([Math.cos(a) * r, Math.sin(a) * r]); }
  return pts;
}
const wrap = (c, html) => '<g class="' + c + '">' + html + "</g>";
function powderSvg(s, full) {
  const out = [];
  const z0 = C.CUP_FLOOR;
  const rIn = C.CUP_R - C.CUP_WALL - 0.05;
  const h = s.layers * C.LAYER;
  if (h > 0.01) {
    out.push(wrap("rf-powder", solidSvg(extrude(disc(rIn, full), z0, h, P), { tone: "mid", crease: "none" })));
    if (!full) {
      let lines = "";
      for (let i = 1; i < s.layers; i++) lines += segment([-rIn, 0, z0 + i * C.LAYER], [rIn, 0, z0 + i * C.LAYER], P);
      out.push(lineSvg(lines, { tone: "lo" }));
    }
  }
  const from = MODEL.layer.dopedFrom, to = Math.min(s.inked, MODEL.layer.count);
  const n = Math.max(0, to - from + 1);
  if (n > 0) {
    const zb = z0 + (from - 1) * C.LAYER;
    const fullH = n * C.LAYER;
    const zTop = zb + fullH;
    const hh = fullH * (1 - s.slump);
    const heat = '<g class="rf-doped" style="--heat:' + s.heat.toFixed(3) + '">';
    if (!full) {
      // in section: the doped half-cylinder's cut face, flush with the powder's cut face
      const face = [[-C.DOPED_R, 0, zb], [C.DOPED_R, 0, zb], [C.DOPED_R, 0, zb + hh], [-C.DOPED_R, 0, zb + hh]];
      out.push(heat + '<path class="rf-doped-face" d="M' + face.map((p) => iso(p, P).map((v) => v.toFixed(1)).join(" ")).join("L") + 'Z"/></g>');
    }
    // top of the doped region; buried under undoped layers it is hidden, once it slumps it sits in a crater
    if (zTop >= z0 + h - 0.01) {
      const r = C.DOPED_R * (1 - s.slump * 0.2);
      const topDisc = solidSvg(extrude(disc(r, full), zb + hh - 0.01, 0.01, P), { tone: "hi", flat: true, crease: "none" });
      if (s.slump > 0.001) {
        const hole = extrude(disc(C.DOPED_R + 2, full), zTop - 0.01, 0.01, P);
        const id = "crater" + (full ? "f" : "c");
        out.push('<clipPath id="' + id + '"><path d="' + hole.fill + '"/></clipPath>');
        out.push('<g clip-path="url(#' + id + ')"><path class="rf-crater" d="' + hole.fill + '"/>' + heat + topDisc + "</g></g>");
        out.push(lineSvg(ring(0, 0, C.DOPED_R + 2, zTop, P, 48), { tone: "mid" }));
      } else {
        out.push(heat + topDisc + "</g>");
      }
    }
  }
  if (s.wet > 0 && s.wet < 0.999 && s.layers >= from) {
    const w = disc(C.DOPED_R, full).filter(([x]) => x <= -C.DOPED_R + 2 * C.DOPED_R * s.wet);
    if (w.length > 2) out.push(wrap("rf-ink", solidSvg(extrude(w, z0 + h - 0.01, 0.01, P), { tone: "hi", flat: true, crease: "none" })));
  }
  return out.join("");
}
let lastKey = "";
function drawCylinder(s) {
  const full = s.where !== "printer";
  const key = [s.where, s.layers, s.inked, s.wet.toFixed(2), s.slump.toFixed(3), s.heat.toFixed(2)].join("|");
  if (key !== lastKey) {
    lastKey = key;
    cyl.innerHTML = CUP_BACK[full] + powderSvg(s, full) + CUP_FRONT[full];
  }
  if (cyl.parentNode !== slots[s.where]) slots[s.where].appendChild(cyl);
  cyl.setAttribute("transform", translateAlong(P, s.pos));
  // a turn arrow while it unscrews
  if (s.turn > 0) {
    const pts = [];
    const a0 = -2.4 + s.turn * 1.6;
    for (let i = 0; i <= 18; i++) { const a = a0 + (1.6 * i) / 18; pts.push(iso([s.pos[0] + Math.cos(a) * (C.CUP_R + 6), s.pos[1] + Math.sin(a) * (C.CUP_R + 6), s.pos[2] + C.CUP_H - 2], P)); }
    twist.innerHTML = lineSvg("M" + pts.map((p) => p.map((v) => v.toFixed(1)).join(" ")).join("L"), { tone: "mid", flow: true });
  } else if (twist.firstChild) twist.innerHTML = "";
}

const SHOWN = MODEL.layer.count;
const T_LAYER = 2;
const PRINT = SHOWN * T_LAYER;
const MOVE = 6, RF = 9, COOL = 4, HOLD = 2;
const TOTAL = PRINT + MOVE + RF + COOL + HOLD;
const PHASE_STARTS = [0, PRINT - T_LAYER * 0.5, PRINT + MOVE * 0.98, PRINT + MOVE + RF * 0.62, PRINT + MOVE + RF + 0.5];
const lerp = (a, b, u) => a + (b - a) * u;
const NOZZLE = -9;   // nozzle plate centre, relative to the jetting gantry

function stateAt(t) {
  const s = { layers: 0, inked: 0, wet: 0, rcX: C.RC_X[0], phX: C.PH_X[0], heater: 0, drops: 0, where: "printer", pos: C.PRINT_HOME, turn: 0, rf: 0, heat: 0, slump: 0, simT: 0, phase: "", sub: "" };
  if (t < PRINT) {
    const n = Math.floor(t / T_LAYER);
    const u = (t - n * T_LAYER) / T_LAYER;
    s.layers = n; s.inked = n;
    const doped = (k) => k >= MODEL.layer.dopedFrom;
    if (u < 0.3) {
      s.rcX = lerp(C.RC_X[0], C.RC_X[1], ease(u / 0.3));
      if (s.rcX > C.BUILD_X) s.layers = n + 1;
      s.sub = "recoater rolls PA12 from the feed into the build cylinder, excess to the overflow";
    } else {
      s.layers = n + 1;
      s.inked = doped(s.layers) ? s.layers : n;
      if (u < 0.58) {
        s.rcX = C.RC_X[1];
        s.phX = lerp(C.PH_X[0], C.PH_X[1], ease((u - 0.3) / 0.28));
        if (doped(s.layers)) {
          const hx = s.phX + NOZZLE - C.BUILD_X;
          s.wet = clamp((hx + C.DOPED_R) / (2 * C.DOPED_R), 0, 1);
          s.drops = Math.abs(hx) < C.DOPED_R + 1 ? 1 : 0;
          if (s.wet < 1) s.inked = n;
          s.sub = "print head jets graphite ink into the part's footprint";
        } else s.sub = "undoped layer, no ink";
      } else if (u < 0.72) {
        s.rcX = C.RC_X[1];
        s.phX = lerp(C.PH_X[1], C.PH_X[0], ease((u - 0.58) / 0.14));
        s.sub = "print head returns home";
      } else if (u < 0.9) {
        const v = (u - 0.72) / 0.18;
        s.rcX = lerp(C.RC_X[1], C.RC_X[0], ease(v));
        s.heater = Math.sin(Math.PI * v);
        s.sub = "recoater returns, its IR heater passes over the layer";
      } else s.sub = "part piston drops one layer, feed piston rises";
    }
    s.inked = Math.min(s.inked, s.layers);
    s.phase = "layer " + Math.max(1, s.layers) + " of " + SHOWN;
  } else {
    s.layers = SHOWN; s.inked = SHOWN;
    if (t < PRINT + MOVE) {
      const u = (t - PRINT) / MOVE;
      const z0 = C.PRINT_HOME[2] + 8, zTop = C.CAGE_H + 14;
      s.where = "air";
      if (u < 0.25) {
        const v = ease(u / 0.25);
        s.pos = [C.BUILD_X, 0, C.PRINT_HOME[2] + 8 * v];
        s.turn = u / 0.25;
        s.sub = "unscrew the build cylinder from the substrate";
      } else if (u < 0.75) {
        const v = (u - 0.25) / 0.5;
        const e = ease(v);
        s.pos = [lerp(C.BUILD_X, C.CAGE_HOME[0], e), lerp(0, C.CAGE_HOME[1], e), lerp(z0, zTop, ease(clamp(v / 0.35, 0, 1)))];
        s.sub = "carry it, green part and loose powder together, to the RF cage";
      } else {
        const v = ease((u - 0.75) / 0.25);
        s.where = "cage";
        s.pos = [C.CAGE_HOME[0], C.CAGE_HOME[1], lerp(zTop, C.CAGE_HOME[2], v)];
        s.sub = "set it on the pedestal between the copper plates";
      }
      s.phase = "to the cage";
    } else {
      s.where = "cage"; s.pos = C.CAGE_HOME;
      const tr = t - PRINT - MOVE;
      if (tr < RF) {
        s.simT = (tr / RF) * MODEL.rf.seconds; s.rf = 1;
        s.heat = MODEL.heatAt(s.simT); s.slump = MODEL.slumpAt(s.simT);
        s.phase = "RF on";
      } else {
        s.simT = MODEL.rf.seconds + ((tr - RF) / (COOL + HOLD)) * MODEL.rf.coolSeconds;
        s.heat = MODEL.coolAt(s.simT - MODEL.rf.seconds); s.slump = MODEL.slumpAt(MODEL.rf.seconds);
        s.phase = "RF off";
      }
    }
  }
  return s;
}
function readoutOf(s) {
  if (s.phase.startsWith("layer")) return s.phase + " · " + s.sub;
  if (s.phase === "RF on") return "RF on · 13.56 MHz · " + MODEL.rf.watts + " W fwd · " + Math.round(s.simT) + " s · " + ((MODEL.rf.watts * s.simT) / 1000).toFixed(0) + " kJ";
  if (s.phase === "RF off") return "RF off · the doped part cools in its crater · loose powder stays loose";
  return s.sub;
}
function draw(s) {
  recoaterG.setAttribute("transform", translateAlong(P, [s.rcX, 0, 0]));
  printheadG.setAttribute("transform", translateAlong(P, [s.phX, 0, 0]));
  heaterG.style.setProperty("--glow", s.heater.toFixed(2));
  drawCylinder(s);
  if (s.drops) {
    const ph = (performance.now() / 120) % 1, pts = [];
    for (let j = 0; j < 6; j++) for (let r = 0; r < 3; r++) {
      const y = -C.DOPED_R + 1 + j * (2 * C.DOPED_R - 2) / 5;
      const zs = C.PRINT_HOME[2] + C.CUP_FLOOR + s.layers * C.LAYER, fall = C.PBED + 7 - zs;
      pts.push(iso([s.phX + NOZZLE, y, C.PBED + 7 - ((ph + r / 3) % 1) * fall], P));
    }
    drops.innerHTML = dotsSvg(pts, { size: 0.55, tone: "hi" });
  } else if (drops.firstChild) drops.innerHTML = "";
  field.setAttribute("opacity", String(s.rf));
  const text = String(s.rf ? MODEL.rf.watts : 0).padStart(3, " ") + " W";
  if (genText && genText.textContent !== text) genText.textContent = text;
  genLed.classList.toggle("on", !!s.rf);
  if (printLed) printLed.classList.toggle("on", s.phase.startsWith("layer"));
  const r = readoutOf(s);
  if (readout.textContent !== r) readout.textContent = r;
  const idx = s.phase.startsWith("layer") ? 0 : s.phase === "RF on" ? 2 : s.phase === "RF off" ? 3 : 1;
  steps.forEach((el, i) => el.toggleAttribute("data-on", i === idx));
}

let clock = 0, target = 0, shown = 0, touring = !still.matches, frame = 0, last = 0, visible = false, idle = 0;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  if (touring) { clock = (clock + dt * (window.__driveSpeed || 1)) % TOTAL; target = clock; shown = clock; }
  else shown = still.matches ? target : shown + (target - shown) * (1 - Math.exp(-dt / 0.25));
  if (!touring && Math.abs(target - shown) < 0.002) shown = target;
  const s = stateAt(shown);
  draw(s);
  const settled = !touring && shown === target && !s.drops;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}
const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
const pause = (t) => {
  touring = false; target = clamp(t, 0, TOTAL - 0.001);
  clearTimeout(idle);
  idle = setTimeout(() => { if (!still.matches) { touring = true; clock = shown; run(); } }, 3600);
  run();
};
new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("pointermove", (e) => { const b = svg.getBoundingClientRect(); pause(clamp((e.clientX - b.left) / b.width, 0, 1) * TOTAL); });
stage.addEventListener("keydown", (e) => {
  let i = PHASE_STARTS.findIndex((p, j) => shown >= p && (j === PHASE_STARTS.length - 1 || shown < PHASE_STARTS[j + 1]));
  if (e.key === "ArrowRight") i = Math.min(PHASE_STARTS.length - 1, i + 1);
  else if (e.key === "ArrowLeft") i = Math.max(0, i - 1);
  else if (e.key === "Home") i = 0;
  else if (e.key === "End") i = PHASE_STARTS.length - 1;
  else return;
  e.preventDefault();
  pause(PHASE_STARTS[i] + 0.01);
  stage.setAttribute("aria-valuenow", String(i));
  stage.setAttribute("aria-valuetext", ["printing", "last layer", "cylinder in the cage", "RF heating", "cooling"][i]);
});
steps.forEach((el, i) => el.addEventListener("click", () => pause(PHASE_STARTS[[0, 2, 3, 4][i]] + 0.01)));
if (still.matches) target = shown = PRINT + MOVE + RF * 0.62;
draw(stateAt(shown));
</script></div>
<script>
(() => {
  const el = document.getElementById("rfam");
  const mq = matchMedia("(prefers-color-scheme: dark)");
  const apply = () => {
    const t = document.documentElement.getAttribute("data-theme");
    const dark = t ? t === "dark" : mq.matches;
    el.setAttribute("data-theme", dark ? "dark" : "light");
  };
  apply();
  mq.addEventListener("change", apply);
  new MutationObserver(apply).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
